<!DOCTYPE html>
<html>
<head>
    <title>Register - AI Game Recommendation System</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <div class="container">

        <h1>👤 Create Account</h1>

        <p class="subtitle">
            Register to use the AI Game Recommendation System
        </p>

        <form action="/register" method="post">

            <input
                type="text"
                name="username"
                placeholder="Enter username"
                required
            >

            <br><br>

            <input
                type="email"
                name="email"
                placeholder="Enter email"
                required
            >

            <br><br>

            <input
                type="password"
                name="password"
                placeholder="Enter password"
                required
            >

            <br><br>

            <input
                type="password"
                name="confirm_password"
                placeholder="Confirm password"
                required
            >

            <br><br>

            <button type="submit">
                Register
            </button>

        </form>

        <p>
            Already have an account?
            <a href="/login">Login</a>
        </p>

        <div id="message"></div>

    </div>

</body>
</html>
